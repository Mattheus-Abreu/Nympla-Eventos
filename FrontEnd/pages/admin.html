<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link
      href="../styles/adminStyle.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body onload="onLoadPage()">
    <div class="header">

      <div class="header_one">
        <img src="../Images/logo.png" alt="logo" class="logo">
  
        <div class="user">
          <h1></h1>
        </div>

      </div>


      <div class="header_two">
        
        <div class="search">
          <div class="search-box">
            <div class="search-field">
              <input id="searchName" placeholder="Search..." class="input" type="text">
              <div class="search-box-icon">
                <button onclick="loadCards()" class="btn-icon-content">
                  <i class="search-icon">
                    <svg xmlns="://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" fill="#fff"></path></svg>
                  </i>
                </button>
              </div>
            </div>
          </div>
        </div>
  
  
        <button onclick="logout()" class="Btn">        
          <div class="sign"><svg viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path></svg></div>
        </button>'

      </div>

    </div>

    <div class="tabs">
      <input type="radio" name="abas" id="aba1" checked>
      <label class ="titulo" for="aba1">Eventos</label>
  
  
      <!-- Conteúdo das Abas -->
      <div id="conteudo1" class="tab-content">
        <div class="eventCards" id="eventCards">

        </div>
      </div>
    </div>

    <div class="modal fade" id="registeredModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Lista de Inscritos</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="registeredList">
          </div>
        </div>
      </div>
    </div>

  









    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
